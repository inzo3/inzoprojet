{% extends 'base.html' %}
{% load static %}

{% block title %}LocaHome • Mot de passe modifié{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}" />
{% endblock %}

{% block content %}
<div class="auth-body"><div class="auth-wrapper container-fluid py-5"><div class="auth-card container" style="max-width: 620px;"><div class="p-5">
  <h1 class="h2 fw-bold mb-3">Mot de passe modifié</h1>
  <p class="text-muted mb-4">Votre mot de passe a été mis à jour. Vous pouvez maintenant vous connecter.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg w-100">Se connecter</a>
</div></div></div></div>
{% endblock %}
