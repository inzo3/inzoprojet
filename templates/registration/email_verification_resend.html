{% extends 'base.html' %}

{% block title %}LocaHome • Renvoyer le lien{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <div class="text-center text-primary mb-3"><i class="bi bi-envelope-arrow-up display-5" aria-hidden="true"></i></div>
        <h1 class="h3 fw-bold text-center">Renvoyer le lien de confirmation</h1>
        <p class="text-body-secondary text-center mb-4">Saisissez l’adresse utilisée lors de l’inscription. Si un compte attend sa confirmation, nous vous renverrons un lien.</p>
        <form method="post">
          {% csrf_token %}
          <label for="verification-email" class="form-label">Adresse e-mail</label>
          <input type="email" class="form-control form-control-lg mb-4" id="verification-email" name="email" autocomplete="email" required />
          <button type="submit" class="btn btn-primary btn-lg w-100">Renvoyer l’e-mail</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
